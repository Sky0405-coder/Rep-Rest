server {
  listen 80;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Gehashte Bundles dürfen lange gecacht werden.
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-Page-App: unbekannte Pfade landen bei index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
